name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish win-x64 (self-contained single file)
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o ./artifacts/win-x64

      - name: Smoke test
        shell: pwsh
        run: |
          # 本步骤刻意断言非零退出码（工具用退出码表达结果）。
          # Actions 的 pwsh 默认 ErrorActionPreference=Stop，且 PS 7.3+
          # PSNativeCommandUseErrorActionPreference=$true，会让原生程序的非零退出码
          # 直接把步骤判失败（断言全过也失败）。必须在此关闭这两项，改由显式断言接管。
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $exe = "./artifacts/win-x64/PCL2VanillaRestore.exe"
          if (-not (Test-Path $exe)) { Write-Error "publish output missing"; exit 1 }
          $fail = 0

          function Invoke-Tool([string[]]$toolArgs) {
            $o = & $exe @toolArgs 2>&1 | Out-String
            return @{ Out = $o; Code = $LASTEXITCODE }
          }

          function Check([string]$name, [bool]$cond, [string]$detail) {
            if ($cond) { Write-Host "  PASS  $name" }
            else { Write-Host "  FAIL  $name -- $detail"; $script:fail++ }
          }

          # 1) --help：应打印用法并返回 0
          $r = Invoke-Tool @("--help")
          Check "help exit 0"        ($r.Code -eq 0)  "got $($r.Code)"
          Check "help shows usage"   ($r.Out -match "用法：") "no usage line"
          Check "banner has version" ($r.Out -match "v\d+\.\d+") "no version in banner"

          # 2) 无参数、无可分析文件：应返回 3 并打印用法
          $r = Invoke-Tool @()
          Check "no-target exit 3"   ($r.Code -eq 3)  "got $($r.Code)"
          Check "no-target banner"   ($r.Out -match "PCL2") "banner missing"

          # 3) 非 PCL 的托管程序集：应识别并拒绝，返回 4
          #    用本工具自己的构建产物做样本——确定是托管程序集，且程序集名必然不是 PCL。
          $managed = (Get-ChildItem "./bin/Release/net8.0" -Filter "PCL2VanillaRestore.dll" -ErrorAction SilentlyContinue |
                      Select-Object -First 1).FullName
          if ($managed) {
            $r = Invoke-Tool @($managed, "--dry")
            Check "foreign managed exit 4" ($r.Code -eq 4) "got $($r.Code)"
            Check "foreign managed reason" ($r.Out -match "不是 Plain Craft Launcher 2") "no reason printed"
          } else {
            Write-Host "  SKIP  foreign managed assembly (build output not found)"
          }

          # 4) 原生（非托管）exe：应给出可读错误而非堆栈，返回 5
          $r = Invoke-Tool @("$env:SystemRoot\System32\notepad.exe", "--dry")
          Check "native exit 5"       ($r.Code -eq 5)  "got $($r.Code)"
          Check "native no stack"     ($r.Out -notmatch "at PclVanillaRestore|StackTrace") "stack leaked"
          Check "native readable err" ($r.Out -match "失败") "no readable error"

          # 5) 自动模式在 CI（输出被重定向）下绝不能弹模态框阻塞：必须快速返回
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $r = Invoke-Tool @("--auto")
          $sw.Stop()
          Check "auto does not block"  ($sw.Elapsed.TotalSeconds -lt 30) "took $($sw.Elapsed.TotalSeconds)s"
          Check "auto exit 0/3"        ($r.Code -eq 0 -or $r.Code -eq 3) "got $($r.Code)"
          Check "auto no GUI launch"   ($r.Out -match "无法弹出选择框|非交互桌面，跳过自动启动|不会自动启动") "no non-interactive notice"

          # 6) WinExe 关键回归：CI 里 stdout 是管道，**绝不能**被误判成 GUI 宿主。
          #    一旦误判，输入全进日志文件，上面所有断言都会拿不到 stdout 而假通过/失败。
          Check "not misjudged as GUI host" (-not (Test-Path "./artifacts/win-x64/PCL2补丁日志.txt")) "log file created => judged as GUI host"
          Check "chinese not mojibake"      ($r.Out -notmatch '\uFFFD') "U+FFFD found => encoding broken"

          # 6b) 整合包解锁的自检逻辑必须存在（源码层面回归：防止后续改动把这条链丢掉）
          #     真正的端到端验证需要 PCL2 本体，CI 里拿不到，因此只断言代码路径已编译进去。
          $dll = (Get-ChildItem "./bin/Release/net8.0" -Filter "PCL2VanillaRestore.dll" -ErrorAction SilentlyContinue |
                  Select-Object -First 1).FullName
          if ($dll) {
            $asm = [System.Reflection.Assembly]::LoadFrom($dll)
            $hasModpack = $null -ne $asm.GetType("ModpackPatch")
            $hasDeps    = $null -ne $asm.GetType("DepResolver")
            Check "modpack patch compiled in" $hasModpack "ModpackPatch type missing"
            Check "dep resolver compiled in"  $hasDeps    "DepResolver type missing"
          } else {
            Write-Host "  SKIP  modpack patch types (build output not found)"
          }

          # 7) 版本对齐：工具版本应与所支持的 PCL2 主版本一致
          $vi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe).Path)
          Check "tool version aligns PCL 2.99" ($vi.ProductVersion -like "2.99*") "ProductVersion=$($vi.ProductVersion)"

          # 8) 工具图标已嵌入（沿用 PCL2 图标，便于用户认出该双击哪个）
          $ic = $null
          try {
            Add-Type -AssemblyName System.Drawing
            $ic = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $exe).Path)
            Check "icon embedded" ($null -ne $ic -and $ic.Width -gt 0) "no icon"
          } catch { Check "icon embedded" $false $_.Exception.Message }
          finally { if ($ic) { $ic.Dispose() } }

          # 9) 必须是 GUI 子系统（双击无控制台黑框）——读 PE 头 Subsystem = 2
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe).Path)
          $pe   = [BitConverter]::ToInt32($bytes, 0x3C)
          $sub  = [BitConverter]::ToUInt16($bytes, $pe + 4 + 20 + 68)
          Check "gui subsystem (no console)" ($sub -eq 2) "Subsystem=$sub (2=GUI, 3=console)"

          if ($fail -gt 0) { Write-Host "$fail smoke assertion(s) failed"; exit 1 }
          Write-Host "all smoke tests passed"
          # 必须显式 exit 0：上面调用过返回非零码的原生命令，
          # 落到脚本末尾会把 $LASTEXITCODE 当作步骤退出码。
          exit 0

      # 关键回归：整合包解锁依赖 Cecil 写回，而 Cecil 写回需要为目标程序集方法签名中的
      # .NET Framework 枚举（如 ThreadPriority）生成参数常量 —— 这一步要求 resolver
      # 能看见 mscorlib / System.Threading。自包含单文件发布时进程目录里没有这些 dll，
      # 于是只有**发布产物**才会抛 `Failed to resolve System.Threading.ThreadPriority`，
      # 普通 dotnet build 完全不暴露。
      # --selftest-cecil 对任意托管程序集做一次读→写往返，正好覆盖这条路径。
      - name: Cecil write-back regression (self-contained publish)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false

          $exe = "./artifacts/win-x64/PCL2VanillaRestore.exe"
          $work = Join-Path $env:RUNNER_TEMP "cecil_rt"
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          # fixture：.NET Framework 程序集，方法签名带 ThreadPriority 默认值，
          # 这样 Cecil 写回时必然要解析该枚举所在的程序集。
          $src = Join-Path $work "fake"
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net48</TargetFramework>
              <AssemblyName>Plain Craft Launcher 2</AssemblyName>
              <UseWindowsForms>true</UseWindowsForms>
            </PropertyGroup>
          </Project>
          '@ | Set-Content (Join-Path $src "fake.csproj") -Encoding UTF8
          @'
          using System.Threading;
          public static class Probe {
              public static void Take(ThreadPriority p = ThreadPriority.Normal) { }
              [System.STAThread]
              public static void Main() { }
          }
          '@ | Set-Content (Join-Path $src "Probe.cs") -Encoding UTF8

          Push-Location $src
          dotnet build -c Release -v q --nologo 2>&1 | Out-Null
          Pop-Location

          $fake = Get-ChildItem $src -Recurse -Filter "Plain Craft Launcher 2.exe" |
                  Select-Object -First 1
          if (-not $fake) { Write-Host "  SKIP  cecil regression (cannot build net48 fixture)"; exit 0 }

          $o = & $exe $fake.FullName --selftest-cecil 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $o
          if ($code -eq 0 -and $o -match "Cecil 往返写成功") {
            Write-Host "  PASS  cecil resolver sees framework assemblies"
          } else {
            Write-Host "  FAIL  cecil roundtrip (exit $code)"
            exit 1
          }
          exit 0
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-win-x64
          path: ./artifacts/win-x64/PCL2VanillaRestore.exe
          if-no-files-found: error
